name: Gitleaks

# Secret scanning of the GitOps repository (whole history of the checked-out
# commit). Only SealedSecret ciphertext is allowed (.gitleaks.toml); any
# plaintext secret fails the check, which is required to merge into main.
on:
  push:
    branches: [main, development, "vuln/**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (git history)
        # --exit-code 1 on any leak; --redact keeps values out of logs and report.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" "$GITLEAKS_IMAGE" \
            git "$PWD" --log-opts=HEAD --config "$PWD/.gitleaks.toml" --redact --no-banner \
            --exit-code 1 --report-format sarif --report-path "$PWD/gitleaks.sarif" 2>&1 | tee gitleaks.log
          rc=${PIPESTATUS[0]}
          grep -q "commits scanned" gitleaks.log || { echo "::error::Gitleaks did not scan the history"; exit 1; }
          exit "$rc"
      - name: Mark findings as Critical
        # Gitleaks SARIF carries no severity; every leaked secret is Critical.
        if: always() && hashFiles('gitleaks.sarif') != ''
        run: |
          python3 - <<'PY'
          import json
          sarif = json.load(open("gitleaks.sarif"))
          for run in sarif.get("runs", []):
              for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                  rule.setdefault("defaultConfiguration", {})["level"] = "error"
                  rule.setdefault("properties", {})["security-severity"] = "9.0"
              for result in run.get("results", []):
                  result["level"] = "error"
          json.dump(sarif, open("gitleaks-critical.sarif", "w"))
          PY
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('gitleaks-critical.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks-critical.sarif
          category: gitleaks
