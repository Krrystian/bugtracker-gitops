# Production Argo CD Application: tracks ONLY the "main" branch of this repo.
# Multiple sources: Helm chart from the app repo + values from this repo ($values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bugtracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Krrystian/bugtracker-app.git
      targetRevision: main
      path: charts/bugtracker
      helm:
        releaseName: bugtracker
        valueFiles:
          - $values/environments/development/values.yaml
    - repoURL: https://github.com/Krrystian/bugtracker-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: bugtracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
