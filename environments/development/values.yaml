# Values for the "development" environment, layered on top of
# charts/bugtracker/values.yaml from Krrystian/bugtracker-app.
#
# image.tag is updated automatically (stage 10) by a commit on the
# "development" branch; it reaches "main" (what Argo CD deploys) only
# through a manually merged pull request.

# VULN-09 (branch vuln/unsigned-image only): a random, UNSIGNED image from a
# public registry instead of the signed project image. Deployed only by the
# sandbox Application; Kyverno must reject it at admission.
image:
  repository: docker.io/library/nginx
  tag: "1.27.3-alpine"

replicaCount: 2

ingress:
  host: localhost
